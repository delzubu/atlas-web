# Atlas documentation site: Jekyll + Just the Docs, themed with the Atlas brand
# (core/docs/design/product-brandbook.md section 12). See AGENTS.md before changing.
title: Atlas
description: "Atlas — The Light Factory: human–AI co-creation for bespoke knowledge work."
# Project page of github.com/delzubu/atlas-web. With a custom domain, set url to
# it and baseurl to "".
url: https://delzubu.github.io
baseurl: /atlas-web

# Branch-based GitHub Pages build (Actions are not used): the theme is loaded
# remotely, pinned to a release.
remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: atlas
logo: /assets/images/atlas-logo.svg
favicon_ico: /favicon.svg

# One light theme, like the product ("black on white, like a book").
enable_copy_code_button: true
search_enabled: true
search:
  heading_level: 2
  previews: 3
  button: false
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
nav_sort: case_insensitive
footer_content: "Atlas, the Light Factory. Industrial power. Bespoke thinking."
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/delzubu/atlas-web"
gh_edit_branch: main
gh_edit_view_mode: edit
aux_links:
  "Atlas on GitHub":
    - https://github.com/delzubu/atlas-web
aux_links_new_tab: true

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - examples/
  - .commands/
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
