<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">Library resources and working projects</title><desc id="desc">A shared library supplies project templates copied into new projects and playbooks read by agents as needed. Project changes remain in the project.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6B6478"/></marker></defs><rect width="760" height="260" rx="12" fill="#F6F7F9"/><g font-family="system-ui,sans-serif" fill="#1F2328"><rect x="35" y="20" width="690" height="105" rx="9" fill="#fff" stroke="#A69AB8"/><text x="380" y="43" text-anchor="middle" font-weight="600" fill="#5B21B6" font-size="16">Shared library</text><rect x="65" y="55" width="280" height="53" rx="7" fill="#F6F7F9" stroke="#A69AB8"/><rect x="415" y="55" width="280" height="53" rx="7" fill="#F6F7F9" stroke="#A69AB8"/><text x="205" y="77" text-anchor="middle" font-size="15" font-weight="600">Project templates</text><text x="205" y="96" text-anchor="middle" font-size="12">Starting files and instructions</text><text x="555" y="77" text-anchor="middle" font-size="15" font-weight="600">Playbooks</text><text x="555" y="96" text-anchor="middle" font-size="12">Reusable working methods</text><path d="M205 125 V177 M555 125 V177" stroke="#6B6478" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="217" y="151" font-size="12">Copy at creation</text><text x="567" y="151" font-size="12">Read as needed</text><rect x="65" y="185" width="630" height="55" rx="8" fill="#fff" stroke="#5B21B6"/><text x="380" y="208" text-anchor="middle" font-size="15" font-weight="600">Working project</text><text x="380" y="226" text-anchor="middle" font-size="12">People and agents create, review and revise their own artifacts</text></g></svg>