<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 325" role="img" aria-labelledby="title desc"><title id="title">Model consolidation</title><desc id="desc">Review each sub-domain against evidence, consolidate the whole, and revise affected parts until consistent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6B6478"/></marker></defs><rect width="760" height="325" rx="12" fill="#F6F7F9"/><g font-family="system-ui,sans-serif" fill="#1F2328" font-size="15"><rect x="260" y="15" width="240" height="56" rx="8" fill="#fff" stroke="#A69AB8"/><text x="380" y="39" text-anchor="middle" font-weight="600" fill="#5B21B6">Inputs and research</text><text x="380" y="60" font-size="12" text-anchor="middle">Requirements and evidence</text><rect x="30" y="110" width="200" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="130" y="134" text-anchor="middle" font-weight="600" fill="#5B21B6">Sub-model 1</text><text x="130" y="155" font-size="12" text-anchor="middle">Construct and validate</text><rect x="280" y="110" width="200" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="380" y="134" text-anchor="middle" font-weight="600" fill="#5B21B6">Sub-model 2</text><text x="380" y="155" font-size="12" text-anchor="middle">Construct and validate</text><rect x="530" y="110" width="200" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="630" y="134" text-anchor="middle" font-weight="600" fill="#5B21B6">Sub-model 3</text><text x="630" y="155" font-size="12" text-anchor="middle">Construct and validate</text><path d="M380 71 V90 H130 V104" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M380 71 V104" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M380 90 H630 V104" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M130 168 V193 H380 V214" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M380 168 V193 H380 V214" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M630 168 V193 H380 V214" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="260" y="220" width="240" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="380" y="244" text-anchor="middle" font-weight="600" fill="#5B21B6">Whole-model review</text><text x="380" y="265" font-size="12" text-anchor="middle">Cross-domain consistency</text><path d="M260 249 H10 V139 H24" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M500 249 H750 V139 H736" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><text x="380" y="305" text-anchor="middle" font-size="13">Resolve differences in the affected sub-models; repeat until satisfactory.</text></g></svg>