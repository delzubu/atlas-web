<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc"><title id="title">One model, multiple views</title><desc id="desc">A reviewed communication model supports an HTML slideshow, a final deck, and written briefing or talk track.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6B6478"/></marker></defs><rect width="760" height="250" rx="12" fill="#F6F7F9"/><g font-family="system-ui,sans-serif" fill="#1F2328" font-size="15"><rect x="255" y="20" width="250" height="64" rx="8" fill="#fff" stroke="#A69AB8"/><text x="380" y="44" text-anchor="middle" font-weight="600" fill="#5B21B6">Reviewed model</text><text x="380" y="65" font-size="12" text-anchor="middle">Audience · evidence · storyline</text><rect x="25" y="155" width="210" height="60" rx="8" fill="#fff" stroke="#A69AB8"/><text x="130" y="179" text-anchor="middle" font-weight="600" fill="#5B21B6">HTML slideshow</text><text x="130" y="200" font-size="12" text-anchor="middle">Preview and comment</text><rect x="275" y="155" width="210" height="60" rx="8" fill="#fff" stroke="#A69AB8"/><text x="380" y="179" text-anchor="middle" font-weight="600" fill="#5B21B6">Final presentation</text><text x="380" y="200" font-size="12" text-anchor="middle">Convert and verify</text><rect x="525" y="155" width="210" height="60" rx="8" fill="#fff" stroke="#A69AB8"/><text x="630" y="179" text-anchor="middle" font-weight="600" fill="#5B21B6">Briefing or talk track</text><text x="630" y="200" font-size="12" text-anchor="middle">Tailor to the audience</text><path d="M380 84 V116 H130 V149" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M380 116 H630 V149" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M235 185 H269" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/></g></svg>