<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc"><title id="title">Research to output</title><desc id="desc">Collect, interpret, investigate, model, review and render. Review may send the work back to research.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6B6478"/></marker></defs><rect width="760" height="250" rx="12" fill="#F6F7F9"/><g font-family="system-ui, sans-serif" fill="#1F2328" font-size="15"><rect x="35" y="35" width="190" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="130" y="59" text-anchor="middle" font-weight="600">Collect</text><text x="130" y="79" text-anchor="middle" font-size="12">Original inputs</text><rect x="285" y="35" width="190" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="380" y="59" text-anchor="middle" font-weight="600">Interpret</text><text x="380" y="79" text-anchor="middle" font-size="12">Facts and questions</text><rect x="535" y="35" width="190" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="630" y="59" text-anchor="middle" font-weight="600">Investigate</text><text x="630" y="79" text-anchor="middle" font-size="12">Evidence and gaps</text><rect x="535" y="155" width="190" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="630" y="179" text-anchor="middle" font-weight="600">Model</text><text x="630" y="199" text-anchor="middle" font-size="12">Structured knowledge</text><rect x="285" y="155" width="190" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="380" y="179" text-anchor="middle" font-weight="600">Review</text><text x="380" y="199" text-anchor="middle" font-size="12">Challenge and refine</text><rect x="35" y="155" width="190" height="58" rx="8" fill="#fff" stroke="#A69AB8"/><text x="130" y="179" text-anchor="middle" font-weight="600">Render</text><text x="130" y="199" text-anchor="middle" font-size="12">Audience-facing output</text><path d="M225 64 H279" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M475 64 H529" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M630 93 V149" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M535 184 H481" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M285 184 H231" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M380 155 V125 H650 V99" fill="none" stroke="#6B6478" stroke-width="1.6" marker-end="url(#arrow)"/><text x="515" y="118" font-size="11" text-anchor="middle">Return to research if needed</text></g></svg>