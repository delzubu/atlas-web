<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Different information structures, one search experience</title><desc id="desc">Document intake preserves documents, sections and passages with semantic metadata and similarity links. Python intake preserves modules, classes and functions with call and import links. Both support retrieval of evidence.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#6b7280"/></marker></defs><rect width="760" height="300" rx="8" fill="#f6f7f9"/><g font-family="system-ui,sans-serif" font-size="14" fill="#1f2328" text-anchor="middle"><text x="190" y="28" font-weight="600" fill="#5b21b6">Document representation</text><text x="570" y="28" font-weight="600" fill="#5b21b6">Python representation</text><g fill="#fff" stroke="#e2e2e2"><rect x="100" y="45" width="180" height="34" rx="5"/><rect x="100" y="99" width="180" height="34" rx="5"/><rect x="34" y="153" width="142" height="36" rx="5"/><rect x="204" y="153" width="142" height="36" rx="5"/><rect x="480" y="45" width="180" height="34" rx="5"/><rect x="480" y="99" width="180" height="34" rx="5"/><rect x="414" y="153" width="142" height="36" rx="5"/><rect x="584" y="153" width="142" height="36" rx="5"/></g><text x="190" y="67">Document</text><text x="190" y="121">Section</text><text x="105" y="176">Passage</text><text x="275" y="176">Passage</text><text x="570" y="67">Module</text><text x="570" y="121">Class</text><text x="485" y="176">Method</text><text x="655" y="176">Function</text><g stroke="#6b7280" fill="none" marker-end="url(#arrow)"><path d="M190 79V95"/><path d="M190 133V143H105V149"/><path d="M190 143H275V149"/><path d="M570 79V95"/><path d="M570 133V143H485V149"/><path d="M660 62H701V149"/></g><path d="M176 171H204M556 171H584" stroke="#5b21b6" stroke-width="1.6" stroke-dasharray="4 3"/><text x="190" y="208" font-size="12">Metadata · embeddings · similarity</text><text x="570" y="208" font-size="12">Calls · imports · embeddings</text><path d="M190 217V230H380V244M570 217V230H380" stroke="#6b7280" fill="none" marker-end="url(#arrow)"/><rect x="220" y="247" width="320" height="39" rx="5" fill="#fff" stroke="#5b21b6"/><text x="380" y="271" font-weight="600" fill="#5b21b6">Search · ranked results and source evidence</text></g></svg>