<!doctype html>
<!-- @dsCard height=288 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · Cover</title>
<!-- Canonical tokens: the same stylesheet every Atlas app loads. -->
<link rel="stylesheet" href="../tokens.css">
</head>
<body>
<div class="cover">
  <style>
    body{margin:0;background:var(--bg)}
    .cover{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
    svg{position:absolute;left:480px;top:0;width:480px;height:288px}
    .ink{fill:var(--fg)} .acc{fill:var(--accent)} .sel{fill:var(--selected)} .mut{fill:var(--muted)} .srf{fill:var(--surface-2)} .hair{fill:var(--border)}
    .name{position:absolute;left:48px;bottom:84px;max-width:420px;margin:0;font-size:120px;line-height:.92;font-weight:700;letter-spacing:-0.02em;color:var(--fg)}
    .tag{position:absolute;left:52px;bottom:36px;max-width:400px;margin:0;font-size:14px;line-height:20px;color:var(--muted)}
  </style>
  <svg viewBox="0 0 480 288" aria-hidden="true">
    <!-- Derivation:
      blocks: fg ink slab 216x288 (document region, 9×space-5) bleeding off top/bottom/right; accent row 168x24 (row-compact); selected band 240x24; muted rail 44 (rail-w) wide; surface-2 inspector sliver 72 wide.
      arrangement: one tall slab with satellites — the Shell itself: rail | tree | document | inspector, left to right.
      pattern: literal motif (the navigator) — tree rows of height row-compact, indented in steps of space-3, gaps of space-2; the "folder-based view" the whole suite shares.
      steps & radii: space-2 (8), space-3 (12), space-5 (24), row-compact (24), rail-w (44); radius-sm (4) on rows, radius-lg (8) on the slab.
    -->
    <rect class="mut" x="0" y="0" width="44" height="288" opacity=".22"/>
    <rect class="acc" x="12" y="24" width="20" height="20" rx="4"/>
    <rect class="mut" x="12" y="56" width="20" height="20" rx="4" opacity=".55"/>
    <rect class="mut" x="12" y="88" width="20" height="20" rx="4" opacity=".55"/>
    <g>
      <rect class="hair" x="56" y="24"  width="112" height="24" rx="4"/>
      <rect class="hair" x="68" y="56"  width="100" height="24" rx="4"/>
      <rect class="sel"  x="44" y="88"  width="148" height="24"/>
      <rect class="acc"  x="80" y="88"  width="88"  height="24" rx="4"/>
      <rect class="hair" x="80" y="120" width="88"  height="24" rx="4"/>
      <rect class="hair" x="68" y="152" width="100" height="24" rx="4"/>
      <rect class="hair" x="56" y="184" width="112" height="24" rx="4"/>
      <rect class="hair" x="68" y="216" width="100" height="24" rx="4"/>
      <rect class="hair" x="68" y="248" width="76"  height="24" rx="4"/>
    </g>
    <rect class="ink" x="192" y="-8" width="216" height="304" rx="8"/>
    <rect class="srf" x="204" y="12" width="120" height="12" rx="4"/>
    <rect class="sel" x="204" y="88" width="192" height="24" opacity=".9"/>
    <rect class="srf" x="408" y="0" width="72" height="288"/>
    <rect class="acc" x="420" y="24" width="48" height="4" rx="2"/>
    <rect class="hair" x="420" y="40" width="48" height="24" rx="4"/>
    <rect class="hair" x="420" y="72" width="36" height="24" rx="4"/>
  </svg>
  <h1 class="name">Atlas</h1>
  <p class="tag">One shell for every tool: content first, everything else one keystroke away.</p>
  <script></script>
</div>
</body>
</html>
