<!doctype html>
<!-- @dsCard group="Document" height=300 subtitle="Title, state, metadata, 1–3 actions, Inspector toggle, overflow" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · DocHeader</title>
<!-- Canonical tokens: the same stylesheet every Atlas app loads. -->
<link rel="stylesheet" href="../tokens.css">
</head>
<body>
<div class="demo">
  <style>
    body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
    .demo{padding:16px;display:grid;gap:14px}
    .cap{font-size:11px;color:var(--muted);margin-bottom:4px}
    .dh{display:flex;align-items:center;gap:8px;height:var(--docheader-h);padding:0 var(--space-3);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);font-size:13px;line-height:18px}
    .ib{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--muted)}
    .ib:hover{background:var(--hover);color:var(--fg)}
    .title{font-size:20px;line-height:26px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .dirty{width:7px;height:7px;border-radius:50%;background:var(--warning-border);flex:none}
    .meta{font-size:12px;color:var(--muted);border:0;background:transparent;padding:3px 6px;border-radius:var(--radius-sm);white-space:nowrap}
    .meta:hover{background:var(--hover);color:var(--fg)}
    .sp{flex:1}
    .btn{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--fg);font-size:13px;white-space:nowrap}
    .btn:hover{background:var(--hover)}
    .pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    .tog[aria-pressed=true]{background:var(--selected);border-color:transparent}
    .n{font-size:11px;color:var(--muted);margin-left:4px}
    .pop{margin:6px 0 0 120px;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-popup);padding:10px 12px;font-size:12px;line-height:16px}
    .pop dl{display:grid;grid-template-columns:72px 1fr;gap:4px 8px;margin:0 0 8px}
    .pop dt{color:var(--muted)}
    .pop code{display:block;font:12px/18px var(--font-mono);background:var(--code-bg);padding:4px 6px;border-radius:var(--radius-sm);word-break:break-all}
    .pop a{color:var(--accent);margin-right:12px}
    svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
  </style>
  <div>
    <div class="cap">kb-explorer, reading (Inspector open)</div>
    <div class="dh">
      <button class="ib" aria-label="Back  Alt+←"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="ib" aria-label="Forward  Alt+→" disabled style="opacity:.4"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
      <span class="title">Westphalia crowns a new king</span>
      <button class="meta" aria-haspopup="dialog">1648 · Westphalia · 3 tags ▾</button>
      <span class="sp"></span>
      <button class="btn">Edit</button>
      <button class="btn tog" aria-pressed="true">Related<span class="n">5</span></button>
      <button class="ib" aria-label="More actions"><svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".8"/><circle cx="8" cy="8" r=".8"/><circle cx="12.5" cy="8" r=".8"/></svg></button>
    </div>
    <div class="pop" role="dialog" aria-label="Details">
      <dl><dt>Date</dt><dd style="margin:0">1648</dd><dt>Location</dt><dd style="margin:0">Westphalia</dd><dt>Tags</dt><dd style="margin:0">Diplomacy, Military event</dd><dt>Sources</dt><dd style="margin:0">City archive; Annals p.65</dd></dl>
      <code>knowledge/timeline/x/-689 Westphalia 124.md</code>
      <p style="margin:8px 0 0"><a href="#">Copy path</a><a href="#">Open on GitHub ↗</a></p>
    </div>
  </div>
  <div>
    <div class="cap">workspace, editing with unsaved changes</div>
    <div class="dh">
      <span class="title">-689 Westphalia 124.md</span><span class="dirty" aria-label="unsaved" title="Unsaved changes"></span>
      <button class="meta">12 KB · markdown · 214 lines ▾</button>
      <span class="sp"></span>
      <button class="btn">Visual ▾</button>
      <button class="btn">Revert</button>
      <button class="btn pri">Save</button>
      <button class="btn tog" aria-pressed="false">Comments<span class="n">2</span></button>
      <button class="ib" aria-label="More actions"><svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".8"/><circle cx="8" cy="8" r=".8"/><circle cx="12.5" cy="8" r=".8"/></svg></button>
    </div>
  </div>
  <script></script>
</div>
</body>
</html>
